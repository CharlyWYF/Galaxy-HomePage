<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>继承之战第一季</title>
    <!-- 引入Material Design 3 CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
        }
        
        .header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            color: #666;
            font-weight: 400;
        }
        
        .episode-list {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        
        .episode-item {
            padding: 24px 30px;
            border-bottom: 1px solid #f0f0f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }
        
        .episode-item:hover {
            background: rgba(102, 126, 234, 0.05);
            transform: translateX(4px);
        }
        
        .episode-item:last-child {
            border-bottom: none;
        }
        
        .episode-name {
            font-size: 1.25rem;
            font-weight: 600;
            color: #333;
        }
        
        .episode-actions {
            display: flex;
            gap: 12px;
        }
        
        /* MD3 Button Styles */
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }
        
        .btn-secondary:hover {
            background: rgba(102, 126, 234, 0.05);
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.3);
        }
        
        .btn-secondary:active {
            transform: translateY(0);
        }
        
        /* Icons */
        .icon {
            font-size: 1.1rem;
        }
        
        /* Toast */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 500;
            z-index: 9999;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Tab Styles */
        .tab-container {
            margin-bottom: 30px;
        }
        
        .tab-nav {
            display: flex;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .tab-btn {
            flex: 1;
            padding: 16px 20px;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            color: #666;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            position: relative;
            overflow: hidden;
        }
        
        .tab-btn:hover {
            background: rgba(102, 126, 234, 0.1);
            color: #667eea;
        }
        
        .tab-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }
        
        .tab-btn.active:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            
            .header {
                padding: 30px 20px;
                margin-bottom: 30px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .tab-nav {
                flex-direction: column;
                gap: 8px;
            }
            
            .tab-btn {
                padding: 14px 18px;
            }
            
            .episode-item {
                padding: 20px;
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
            }
            
            .episode-name {
                text-align: center;
            }
            
            .episode-actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>继承之战</h1>
            <p>点击播放按钮访问视频，点击复制按钮复制</p>
        </div>
        
        <!-- Tab切换 -->
        <div class="tab-container">
            <div class="tab-nav" id="tabNav">
                <button class="tab-btn active" data-season="1">第一季</button>
                <button class="tab-btn" data-season="2">第二季</button>
                <button class="tab-btn" data-season="3">第三季</button>
                <button class="tab-btn" data-season="4">第四季</button>
            </div>
        </div>
        
        <div class="episode-list" id="episodeList"></div>
    </div>
    
    <!-- 提示框 -->
    <div class="toast" id="toast"></div>

    <script>
        // 四季剧集数据
        const SEASONS = {
            1: {
                name: "第一季",
                episodes: [
                    { name: "第01集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandiyiji/第01集/index.m3u8" },
                    { name: "第02集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandiyiji/第02集/index.m3u8" },
                    { name: "第03集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandiyiji/第03集/index.m3u8" },
                    { name: "第04集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandiyiji/第04集/index.m3u8" },
                    { name: "第05集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandiyiji/第05集/index.m3u8" },
                    { name: "第06集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandiyiji/第06集/index.m3u8" },
                    { name: "第07集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandiyiji/第07集/index.m3u8" },
                    { name: "第08集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandiyiji/第08集/index.m3u8" },
                    { name: "第09集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandiyiji/第09集/index.m3u8" },
                    { name: "第10集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandiyiji/第10集/index.m3u8" }
                ]
            },
            2: {
                name: "第二季",
                episodes: [
                    { name: "第01集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandierji/第01集/index.m3u8" },
                    { name: "第02集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandierji/第02集/index.m3u8" },
                    { name: "第03集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandierji/第03集/index.m3u8" },
                    { name: "第04集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandierji/第04集/index.m3u8" },
                    { name: "第05集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandierji/第05集/index.m3u8" },
                    { name: "第06集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandierji/第06集/index.m3u8" },
                    { name: "第07集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandierji/第07集/index.m3u8" },
                    { name: "第08集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandierji/第08集/index.m3u8" },
                    { name: "第09集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandierji/第09集/index.m3u8" },
                    { name: "第10集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandierji/第10集/index.m3u8" }
                ]
            },
            3: {
                name: "第三季",
                episodes: [
                    { name: "第01集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisanji/第01集/index.m3u8" },
                    { name: "第02集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisanji/第02集/index.m3u8" },
                    { name: "第03集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisanji/第03集/index.m3u8" },
                    { name: "第04集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisanji/第04集/index.m3u8" },
                    { name: "第05集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisanji/第05集/index.m3u8" },
                    { name: "第06集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisanji/第06集/index.m3u8" },
                    { name: "第07集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisanji/第07集/index.m3u8" },
                    { name: "第08集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisanji/第08集/index.m3u8" },
                    { name: "第09集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisanji/第09集/index.m3u8" },
                    { name: "第10集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisanji/第10集/index.m3u8" }
                ]
            },
            4: {
                name: "第四季",
                episodes: [
                    { name: "第01集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisiiji/第01集/index.m3u8" },
                    { name: "第02集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisiiji/第02集/index.m3u8" },
                    { name: "第03集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisiiji/第03集/index.m3u8" },
                    { name: "第04集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisiiji/第04集/index.m3u8" },
                    { name: "第05集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisiiji/第05集/index.m3u8" },
                    { name: "第06集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisiiji/第06集/index.m3u8" },
                    { name: "第07集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisiiji/第07集/index.m3u8" },
                    { name: "第08集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisiiji/第08集/index.m3u8" },
                    { name: "第09集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisiiji/第09集/index.m3u8" },
                    { name: "第10集", url: "https://c1.rrcdnbf5.com/video/jichengzhizhandisiiji/第10集/index.m3u8" }
                ]
            }
        };

        // DOM元素
        const episodeList = document.getElementById('episodeList');
        const toast = document.getElementById('toast');
        const tabNav = document.getElementById('tabNav');
        let currentSeason = 1;

        // 渲染剧集列表
        function renderEpisodes(season = 1) {
            const episodes = SEASONS[season].episodes;
            episodeList.innerHTML = '';
            
            episodes.forEach((episode, index) => {
                const episodeItem = document.createElement('div');
                episodeItem.className = 'episode-item';
                
                episodeItem.innerHTML = `
                    <div class="episode-name">${episode.name}</div>
                    <div class="episode-actions">
                        <button class="btn btn-primary" 
                                onclick="playEpisode('${episode.url}')">
                            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="5 3 19 12 5 21 5 3"></polygon>
                            </svg>
                            播放
                        </button>
                        <button class="btn btn-secondary" 
                                onclick="copyUrl('${episode.url}')">
                            <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                            复制
                        </button>
                    </div>
                `;
                
                episodeList.appendChild(episodeItem);
            });
        }

        // 播放剧集
        function playEpisode(url) {
            window.open(url, '_blank');
        }

        // 复制
        async function copyUrl(url) {
            try {
                await navigator.clipboard.writeText(url);
                showToast('已复制到剪贴板');
            } catch (err) {
                // 降级方案：使用input元素复制
                const input = document.createElement('input');
                input.value = url;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast('已复制到剪贴板');
            }
        }

        // 显示提示
        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }

        // 切换季节
        function switchSeason(season) {
            // 更新当前季节
            currentSeason = season;
            
            // 更新tab状态
            const tabBtns = tabNav.querySelectorAll('.tab-btn');
            tabBtns.forEach(btn => {
                btn.classList.remove('active');
            });
            tabNav.querySelector(`[data-season="${season}"]`).classList.add('active');
            
            // 重新渲染剧集
            renderEpisodes(season);
        }

        // 初始化tab事件监听
        function initTabEvents() {
            tabNav.addEventListener('click', (e) => {
                if (e.target.classList.contains('tab-btn')) {
                    const season = parseInt(e.target.dataset.season);
                    switchSeason(season);
                }
            });
        }

        // 初始化
        initTabEvents();
        renderEpisodes(currentSeason);
    </script>
</body>
</html>
