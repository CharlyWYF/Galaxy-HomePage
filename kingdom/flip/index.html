<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>实名连连看（翻牌版）✨</title> 
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-light: #a78bfa;
            --bg-start: #e0e7ff;
            --bg-end: #f0f9ff;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-end) 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeInDown 0.8s ease;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
            text-shadow: 0 2px 10px rgba(99, 102, 241, 0.2);
        }

        p { color: #6b7280; font-size: 0.95rem; }

        .status-bar {
            display: flex;
            gap: 30px;
            margin-bottom: 20px;
            font-weight: 700;
            color: #4b5563;
            background: rgba(255,255,255,0.6);
            backdrop-filter: blur(8px);
            padding: 10px 25px;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* ================= 核心：3D翻转卡牌结构 ================= */
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 800px;
            perspective: 1000px; /* 3D 视距，必须在父元素上 */
            padding: 10px;
        }

        /* 1. 卡牌容器 (Wrapper)：负责旋转 */
        .card-wrapper {
            position: relative;
            height: 110px;
            width: 100%;
            cursor: pointer;
            transform-style: preserve-3d; /* 保持子元素3D空间 */
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1), opacity 0.5s;
        }

        /* 翻转状态：旋转180度 */
        .card-wrapper.is-flipped {
            transform: rotateY(180deg);
        }

        /* 2. 卡牌正反面通用样式 */
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            backface-visibility: hidden; /* 背面不可见，关键属性 */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-weight: 700;
            user-select: none;
        }

        /* 3. 封面 (Back)：默认显示，位于0度 */
        .face-back {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            font-size: 2rem;
            transform: rotateY(0deg);
            z-index: 2; /* 默认在上面 */
        }
        .face-back::after {
            content: '❓';
        }

        /* 4. 内容面 (Front)：默认隐藏，位于180度（背面朝上） */
        .face-front {
            background: white;
            color: #1f2937;
            transform: rotateY(180deg); /* 预先旋转180度 */
            font-size: 1.1rem;
            border: 2px solid var(--primary-color);
            padding: 5px;
        }

        /* 5. 匹配成功状态 */
        .card-wrapper.matched {
            opacity: 0; /* 消失 */
            pointer-events: none; /* 禁止点击 */
            transform: rotateY(180deg) scale(0.8); /* 保持翻转状态并缩小 */
        }

        /* 6. 错误震动动画 */
        .card-wrapper.shake {
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }
        /* 错误时，内容面变红 */
        .card-wrapper.shake .face-front {
            background-color: #fee2e2;
            border-color: var(--error-color);
            color: var(--error-color);
        }

        /* 移动端适配 */
        @media (max-width: 600px) {
            .game-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 10px;
            }
            .card-wrapper { height: 90px; }
            .face-front { font-size: 0.9rem; }
            .face-back { font-size: 1.5rem; }
        }

        @keyframes shake {
            10%, 90% { transform: rotateY(180deg) translate3d(-2px, 0, 0); } /* 注意保持 rotateY(180deg) */
            20%, 80% { transform: rotateY(180deg) translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: rotateY(180deg) translate3d(-6px, 0, 0); }
            40%, 60% { transform: rotateY(180deg) translate3d(6px, 0, 0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* 弹窗样式保持不变 */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            backdrop-filter: blur(5px);
        }
        .modal.show { opacity: 1; pointer-events: auto; }
        .modal-content {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal.show .modal-content { transform: scale(1); }
        .btn-reset {
            margin-top: 20px;
            padding: 12px 40px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

    </style>
</head>
<body>

    <header>
        <h1>🌟 实名连连看（翻牌版）</h1>
        <p>翻开卡牌，匹配真实姓名与昵称！</p>
    </header>

    <div class="status-bar">
        <span>剩余: <span id="remaining-pairs">0</span></span>
        <span>步数: <span id="moves">0</span></span>
    </div>

    <div class="game-grid" id="game-grid"></div>

    <div class="modal" id="win-modal">
        <div class="modal-content">
            <h2>🎉 挑战成功！</h2>
            <p style="margin: 15px 0 25px;">大家的名字你都记住了！</p>
            <button class="btn-reset" onclick="initGame()">再玩一次</button>
        </div>
    </div>

<script>
    // ==========================================
    // 数据配置区
    // ==========================================
    const DATA_SOURCE = [
        { realName: "任明浩", nickname: "小铭" },
        { realName: "安妮", nickname: "Saya" },
        { realName: "余鸣凤", nickname: "魔戒小鱼" },
        { realName: "李健", nickname: "小年轻" },
        { realName: "邓家祥", nickname: "1234" },
        { realName: "陈毅伯", nickname: "星河" },
        { realName: "沈念", nickname: "念柚" },
        { realName: "张扬君", nickname: "Sakura" },
        { realName: "涂雨皓", nickname: "冰糖" },
        { realName: "胡子慧", nickname: "Puppy" },
        { realName: "陈浩然", nickname: "Ace" },
        { realName: "吴宗廷", nickname: "T1ng" },
        { realName: "吴承烨", nickname: "葉先生" },
        { realName: "杨文涛", nickname: "孩哥" }
    ];

    // ==========================================
    // 游戏逻辑
    // ==========================================
    
    let firstCardWrapper = null;
    let secondCardWrapper = null;
    let lockBoard = false;
    let remainingPairs = 0;
    let moves = 0;

    const gridElement = document.getElementById('game-grid');
    const remainingElement = document.getElementById('remaining-pairs');
    const movesElement = document.getElementById('moves');
    const winModal = document.getElementById('win-modal');

    function initGame() {
        winModal.classList.remove('show');
        gridElement.innerHTML = '';
        firstCardWrapper = null;
        secondCardWrapper = null;
        lockBoard = false;
        moves = 0;
        movesElement.innerText = moves;

        // 准备数据
        let tempCards = [];
        DATA_SOURCE.forEach((item, index) => {
            // 真名
            tempCards.push({ id: `pair-${index}`, text: item.realName });
            // 昵称
            tempCards.push({ id: `pair-${index}`, text: item.nickname });
        });

        remainingPairs = DATA_SOURCE.length;
        remainingElement.innerText = remainingPairs;
        tempCards = shuffle(tempCards);

        // 生成 DOM
        tempCards.forEach(cardData => {
            // 1. 创建容器 (Wrapper)
            const wrapper = document.createElement('div');
            wrapper.classList.add('card-wrapper');
            wrapper.dataset.id = cardData.id;

            // 2. 创建封面 (Back - 显示问号)
            const faceBack = document.createElement('div');
            faceBack.classList.add('card-face', 'face-back');

            // 3. 创建内容面 (Front - 显示文字)
            const faceFront = document.createElement('div');
            faceFront.classList.add('card-face', 'face-front');
            faceFront.innerText = cardData.text;

            // 组装
            wrapper.appendChild(faceBack);
            wrapper.appendChild(faceFront);
            wrapper.addEventListener('click', handleCardClick);
            
            gridElement.appendChild(wrapper);
        });
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function handleCardClick(e) {
        if (lockBoard) return;
        
        // 确保获取到的是 wrapper 元素 (即使点击的是内部的 face)
        const currentWrapper = e.currentTarget;

        // 已经匹配或已经是第一张翻开的卡，则忽略
        if (currentWrapper === firstCardWrapper || currentWrapper.classList.contains('matched')) return;

        // 翻转动画
        currentWrapper.classList.add('is-flipped');

        if (!firstCardWrapper) {
            firstCardWrapper = currentWrapper;
            return;
        }

        secondCardWrapper = currentWrapper;
        moves++;
        movesElement.innerText = moves;
        checkForMatch();
    }

    function checkForMatch() {
        let isMatch = firstCardWrapper.dataset.id === secondCardWrapper.dataset.id;

        if (isMatch) {
            disableCards();
        } else {
            unflipCards();
        }
    }

    function disableCards() {
        lockBoard = true;
        
        // 庆祝粒子
        confetti({
            particleCount: 60,
            spread: 70,
            origin: { y: 0.6 },
            colors: ['#10b981', '#6366f1']
        });

        setTimeout(() => {
            // 添加 matched 类，CSS 会处理 opacity: 0
            firstCardWrapper.classList.add('matched');
            secondCardWrapper.classList.add('matched');
            
            resetBoard();
            remainingPairs--;
            remainingElement.innerText = remainingPairs;

            if (remainingPairs === 0) {
                handleWin();
            }
        }, 600);
    }

    function unflipCards() {
        lockBoard = true;
        
        // 错误震动
        setTimeout(() => {
            firstCardWrapper.classList.add('shake');
            secondCardWrapper.classList.add('shake');
        }, 400); // 等翻转完再震动

        setTimeout(() => {
            // 翻回去
            firstCardWrapper.classList.remove('is-flipped', 'shake');
            secondCardWrapper.classList.remove('is-flipped', 'shake');
            resetBoard();
        }, 1000);
    }

    function resetBoard() {
        [firstCardWrapper, secondCardWrapper, lockBoard] = [null, null, false];
    }

    function handleWin() {
        setTimeout(() => {
            winModal.classList.add('show');
            var duration = 3000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();
                if (timeLeft <= 0) return clearInterval(interval);
                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: Math.random(), y: Math.random() - 0.2 } }));
            }, 250);
        }, 500);
    }

    initGame();

</script>
</body>
</html>
