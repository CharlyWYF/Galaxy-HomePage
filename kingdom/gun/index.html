<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>Apex 枪械查询器</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Apex 枪械查询</h1>

        <div class="input-area">
            <input type="text" id="gunInput" placeholder="请输入枪械名称 (例如: R99 或 平行步枪)">
            <button onclick="lookupGun()">查询</button>
        </div>

        <div class="result-area">
            <div id="infoDisplay" class="info-card">
                <p>在此输入枪械名称进行查询。</p>
            </div>
            <img id="gunImage" src="" alt="枪械图片占位符" class="gun-image hidden">
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
