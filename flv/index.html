<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>flv</title>
    <style>
        #refreshButton {
            display: block;
            margin: 20px auto;
            padding: 15px 30px;
            font-size: 18px;
            background-color: #74c577;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        #refreshButton:hover {
            background-color: #45a049;
        }

        #videoElement {
            display: block;
            margin: 0 auto;
            width: 98vw;
        }
    </style>
</head>

<body>
    <video id="videoElement" controls></video>
    <button id="refreshButton">刷新</button>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@latest/dist/flv.min.js"></script>
    <script>
        let flvPlayer = null;

        function setupPlayer() {
            if (flvjs.isSupported()) {
                const videoElement = document.getElementById('videoElement');

                // 如果已有播放器，先销毁
                if (flvPlayer) {
                    flvPlayer.destroy();
                }

                flvPlayer = flvjs.createPlayer({
                    type: 'flv',
                    isLive: true,
                    hasAudio: true,
                    hasVideo: true,
                    url: 'https://qqgroup.6721.liveplay.ilive.qq.com/live/6721_67d31acc5a8be141e6a7382762cdcd66_1080p4000k.flv?txSecret=0489ecdf4a7c839b688c5bfd101ba9a6',
                    cors: true
                }, {
                    enableWorker: true,
                    enableStashBuffer: false,
                    stashInitialSize: 128,
                    lazyLoad: true,
                    lazyLoadMaxDuration: 3 * 60,
                    deferLoadAfterSourceOpen: true
                });

                flvPlayer.attachMediaElement(videoElement);

                flvPlayer.on(flvjs.Events.ERROR, (errorType, errorDetail, errorInfo) => {
                    console.error('Error:', errorType, errorDetail, errorInfo);
                });

                flvPlayer.on(flvjs.Events.METADATA_ARRIVED, () => {
                    console.log('Metadata arrived');
                });

                flvPlayer.on(flvjs.Events.STATISTICS_INFO, (info) => {
                    console.log('Statistics info:', info);
                });

                try {
                    flvPlayer.load();
                    flvPlayer.play();
                } catch (e) {
                    console.error('Error:', e);
                }
            }
        }

        // 初始化播放器
        setupPlayer();

        // 添加刷新按钮点击事件
        document.getElementById('refreshButton').addEventListener('click', function () {
            console.log('Refreshing video...');
            setupPlayer();
        });
    </script>
</body>

</html>
