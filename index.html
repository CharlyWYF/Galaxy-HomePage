<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a111b"><title>查理の星空</title><meta name="description" content="CHARLY 的小宇宙。拖动探索星空，双击小行星前往另一个地方。"><link rel="icon" href="icon/favicon.ico"><link rel="preload" href="vendor/fonts/oxanium/Oxanium.ttf" as="font" type="font/ttf" crossorigin><link rel="stylesheet" href="vendor/fonts/noto-sans-sc/fonts.css?v=20261018-fonts1"><link rel="stylesheet" href="galaxy.css?v=20261018-sector-visible1"></head>
<body>
<canvas id="space" aria-label="可以拖动平移和缩放的三维星图"></canvas><div class="vignette" aria-hidden="true"></div>
<header><a class="brand" href="./">CHARLY</a><div class="search"><svg class="search-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><input id="search" aria-label="查找星球或链接" placeholder="寻找一颗星星…" autocomplete="off"><kbd>/</kbd></div></header>
<aside class="intro"><h1>查理の星空</h1><div>悬停了解星球，靠近后进入。</div></aside>
<div id="labels" aria-label="星球链接"></div><div id="sectorLabels" aria-hidden="true"></div>
<div id="empty" hidden role="status">这片星区没有找到匹配的坐标。</div>
<section id="destination" hidden aria-label="星球信息"><button id="close" aria-label="关闭星球信息">✕</button><p id="destSector"></p><h2 id="destTitle"></h2><div id="destDesc"></div><p id="destUrl"></p></section>
<a id="destLink" class="entry-button" hidden rel="noopener noreferrer"><span id="entryText"></span><span aria-hidden="true">↗</span></a>
<div class="zoom"><button id="plus" aria-label="放大星图">＋</button><div id="zoomValue">1.0×</div><button id="minus" aria-label="缩小星图">−</button><button id="home" aria-label="返回初始星图"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m3 10 9-7 9 7M5 8.5V21h5v-7h4v7h5V8.5"/></svg></button></div>
<footer><span class="desktop-hint">左键拖动 ｜ 右键旋转 ｜ 滚轮缩放</span><nav aria-label="星区筛选"></nav></footer>
<div id="loading" role="status"><span class="loading-orbit" aria-hidden="true"></span><span>正在展开星图</span><span class="loading-dots" aria-hidden="true"><span>·</span><span>·</span><span>·</span></span></div>
<div id="departure" hidden role="dialog" aria-modal="true" aria-labelledby="departureTitle"><div id="departureVeil" aria-hidden="true"></div><div class="departure-status"><span class="departure-signal" aria-hidden="true"></span><p id="departureTitle" role="status"></p><small id="departureHost"></small><button id="cancelDeparture">返回星图</button></div></div>
<script type="module">
const loading=document.getElementById('loading');
function startupFailed(error){const detail=String(error?.error?.stack||error?.reason?.stack||error?.stack||error?.message||error);console.error('Star map startup failed:',detail);if(document.body.classList.contains('ready'))return;loading.replaceChildren(document.createTextNode('星图启动失败'));const reason=document.createElement('small');reason.textContent=detail.split('\n')[0];loading.append(reason);const retry=document.createElement('button');retry.textContent='重新展开';retry.onclick=()=>location.reload();loading.append(retry);}
window.addEventListener('error',startupFailed);
window.addEventListener('unhandledrejection',startupFailed);
import('./galaxy.js?v=20261018-sector-lower2').catch(startupFailed);
</script></body></html>
