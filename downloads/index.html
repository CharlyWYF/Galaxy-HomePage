<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Charly's Downloads</title>

    <!-- 添加网站图标 -->
    <link rel="icon" href="icon/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="icon/favicon.ico" type="image/x-icon">
    
    <!-- 为了支持更多设备，可以添加不同尺寸的图标 -->
    <link rel="apple-touch-icon" sizes="180x180" href="icon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="icon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="icon/favicon-16x16.png">

    <!-- 引入本地CSS -->
    <link rel="stylesheet" href="/style.css">

    <!-- 在 <head> 标签中添加，在其他 CSS 之前 -->
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <br><br><br><br><br><br>
        <!-- 搜索框 -->
        <div class="row mb-4">
            <div class="col-12 search-container">
                <span class="brand-text">CharlyW's Downloads</span>
                <div class="search-box-container">
                    <input type="text" class="form-control" id="searchBox" placeholder="">
                    <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18">
                        <path fill="none" stroke="currentColor" stroke-width="2" d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- 文件下载集合 -->
        <div class="row" id="fileDownloadCollection">
            
        </div>
    </div>
<br>

    <!-- 添加主题切换按钮 -->
    <div class="theme-toggle">
        <button id="themeToggle">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
        </button>
    </div>

    <!-- 引入本地JavaScript -->
    <script src="/downloads/data.js?v=1.0.1"></script>
    <script src="/downloads/script.js"></script>
</body>

</html>
