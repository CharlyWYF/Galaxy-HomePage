<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>查理放映厅2.0</title>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #1a2a6c);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        header {
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 60px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.2rem;
            color: #ddd;
            max-width: 800px;
            margin: 0 auto;
        }

        .player-container {
            position: relative;
            width: 100%;
            border-radius: 60px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            background: rgba(0, 0, 0, 0.6);
        }

        @media (max-width: 768px) {
            #videoElement {
                height: auto;
            }
        }

        #videoElement {
            width: 100%;
            display: block;
            background: #000;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 60px;
            backdrop-filter: blur(10px);
            margin-top: 20px;
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            flex: auto;
            align-items: center;
            justify-content: space-around;
        }

        .btn {
            padding: 10px 20px;
            background: linear-gradient(to right, #4a00e0, #8e2de2);
            color: white;
            border: none;
            border-radius: 60px;
            font-size: 1.0rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(142, 45, 226, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(142, 45, 226, 0.5);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-refresh {
            background: linear-gradient(to right, #00b09b, #96c93d);
        }

        .btn-stop {
            background: linear-gradient(to right, #ff416c, #ff4b2b);
        }

        .btn-fullscreen {
            background: linear-gradient(to right, #11998e, #38ef7d);
        }

        .btn-sound {
            background: linear-gradient(to right, #FF9800, #FF5722);
        }

        .status {
            display: flex;
            padding: 15px 25px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            font-size: 1.1rem;
            gap: 10px;
            flex: auto;
            justify-content: center;
        }

        .status i {
            color: #38ef7d;
            font-size: 1.4rem;
        }

        .audio-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 15px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            min-width: 200px;
        }

        .volume-slider {
            flex: 1;
            -webkit-appearance: none;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, #8e2de2, #4a00e0);
            outline: none;
        }

        .volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
        }

        .volume-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
            border: none;
        }

        .info-panel {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 60px;
            padding: 25px;
            margin-top: 20px;
        }

        .info-card {
            flex: 1;
            min-width: 280px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 60px;
            padding: 25px;
            backdrop-filter: blur(10px);
        }

        .info-card h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
            color: #8e2de2;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .info-card p {
            line-height: 1.8;
            color: #e0e0e0;
        }

        .url-display {
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 20px;
            border-radius: 8px;
            font-family: monospace;
            font-size: 0.95rem;
            overflow-x: auto;
            margin: 15px 0;
            white-space: nowrap;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .feature {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.1rem;
        }

        .feature i {
            color: #38ef7d;
            font-size: 1.3rem;
        }

        .sound-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #FF9800;
            background: rgba(255, 152, 0, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .btn {
                padding: 12px 20px;
                font-size: 1rem;
            }

            .controls {
                flex-direction: column;
            }

            #videoElement {
                height: auto;
            }

            .audio-controls {
                min-width: 100%;
            }
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 1.5rem;
        }

        .error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 0, 0, 0.7);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            max-width: 80%;
        }

        .error-btn {
            margin-top: 15px;
            padding: 10px 20px;
            background: white;
            color: #ff4b2b;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .watermark {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .audio-info {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
            justify-content: center;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-video"></i> 查理放映厅</h1>
            <p class="subtitle">www.charlyw.top/flv</p>
        </header>

        <div class="player-container">
            <!-- 移除了 muted 属性 -->
            <video id="videoElement" controls muted></video>
            <div class="loading" id="loadingIndicator">
                <i class="fas fa-spinner fa-spin"></i> 正在加载视频流...
            </div>
            <div class="error" id="errorDisplay" style="display: none;"></div>
        </div>

        
        <div class="controls">
            <div class="status">
                <i class="fas fa-circle"></i>
                <span id="statusText">播放器已就绪</span>
            </div>
            <div class="control-group">
                <button class="btn" id="playBtn">
                    <i class="fas fa-play"></i> 播放
                </button>
                <button class="btn btn-stop" id="stopBtn">
                    <i class="fas fa-stop"></i> 停止
                </button>
                <button class="btn btn-refresh" id="refreshBtn">
                    <i class="fas fa-sync"></i> 刷新
                </button>
                <button class="btn btn-fullscreen" id="fullscreenBtn">
                    <i class="fas fa-expand"></i> 全屏
                </button>
                <button class="btn btn-sound" id="muteBtn">
                    <i class="fas fa-volume-up"></i> 取消静音
                </button>
            </div>


            <div class="audio-controls">
                <i class="fas fa-volume-down"></i>
                <input type="range" min="0" max="1" step="0.01" value="1" class="volume-slider" id="volumeSlider">
                <i class="fas fa-volume-up"></i>
            </div>

            <div class="audio-info">
                <div class="sound-status" id="audioStatus">
                    <i class="fas fa-volume-up"></i>
                    <span>音量: 100%</span>
                </div>
            </div>
        </div>

        <div class="info-panel">
            <div class="info-card">
                <h3><i class="fas fa-info-circle"></i> 提示</h3>
                <p><strong>小窗播放: </strong>视频内部 右下角 三个点→[画中画]，手机电脑都可以哦</p>
                <p><strong>记得刷新: </strong>如果延迟高记得刷新哦</p>
                <p><strong>声音控制: </strong>使用音量滑块调整音量，点击"静音"按钮开关声音</p>
            </div>
        </div>
        <div class="info-panel">
            <div class="info-card">
                <h3><i class="fas fa-info-circle"></i> 当前视频信息</h3>
                <p>视频源类型: <strong>HTTP-FLV 直播流</strong></p>
                <p>当前状态: <strong id="streamStatus">正在连接...</strong></p>
                <p>视频尺寸: <strong>1920×1080 (1080p)</strong></p>
                <p>音频状态: <strong id="audioState">正常</strong></p>
            </div>
        </div>
    </div>

    <script>
        // 获取DOM元素
        const videoElement = document.getElementById('videoElement');
        const playBtn = document.getElementById('playBtn');
        const stopBtn = document.getElementById('stopBtn');
        const refreshBtn = document.getElementById('refreshBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const statusText = document.getElementById('statusText');
        const streamStatus = document.getElementById('streamStatus');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorDisplay = document.getElementById('errorDisplay');
        const audioStatus = document.getElementById('audioStatus');
        const audioState = document.getElementById('audioState');

        let flvPlayer;
        let isMuted = false;

        // 初始化播放器
        function initPlayer() {
            // 隐藏错误信息，显示加载指示器
            errorDisplay.style.display = 'none';
            loadingIndicator.style.display = 'block';
            streamStatus.textContent = '正在连接...';
            audioState.textContent = '检测中...';

            // 检查浏览器支持
            if (!flvjs.isSupported()) {
                showError('当前浏览器不支持 flv.js！请使用最新版Chrome、Firefox或Edge浏览器。');
                return;
            }

            // 如果已有播放器实例，先销毁
            if (flvPlayer) {
                flvPlayer.destroy();
            }

            // 创建新的播放器实例
            flvPlayer = flvjs.createPlayer({
                type: 'flv',
                // url: 'https://qqgroup.6721.liveplay.ilive.qq.com/live/6721_1d9bc6bbbcec174cafe7e0d96a90a21b_1080p4000k.flv?txSecret=dd6ba0a8f2bf7c436a18844abc460c3c&txTime=6856708B',//小年轻
                url: 'https://qqgroup.6721.liveplay.ilive.qq.com/live/6721_592d0ed39864c1cd2ad6fb865b15b4ae_1080p4000k.flv?txSecret=568d87a21b91349bda1c8e3b00174b08&txTime=68569014',//cw
                isLive: true,
                cors: true,
                hasAudio: true,
                hasVideo: true,
                stashInitialSize: 128,
                enableWorker: true,
                enableStashBuffer: false
            });

            // 关联video元素
            flvPlayer.attachMediaElement(videoElement);

            // 加载视频流
            flvPlayer.load();

            // 尝试自动播放
            flvPlayer.play().then(() => {
                statusText.textContent = '[小铭] 放映中';
                streamStatus.textContent = '直播中';
                loadingIndicator.style.display = 'none';

                // 检查音频状态
                checkAudioState();

            }).catch(e => {
                console.error('自动播放失败:', e);
                statusText.textContent = '播放已暂停 (点击播放按钮开始)';
                streamStatus.textContent = '已连接 (暂停中)';
                loadingIndicator.style.display = 'none';

                // 检查音频状态
                checkAudioState();
            });

            // 事件监听
            flvPlayer.on(flvjs.Events.ERROR, (errType, errDetail) => {
                console.error('播放器错误:', errType, errDetail);

                let errorMsg = '播放器发生错误: ';
                switch (errType) {
                    case flvjs.ErrorTypes.NETWORK_ERROR:
                        errorMsg += '没有人在放映哦，稍后再来吧！';
                        break;
                    case flvjs.ErrorTypes.MEDIA_ERROR:
                        errorMsg += '媒体错误';
                        break;
                    case flvjs.ErrorTypes.OTHER_ERROR:
                    default:
                        errorMsg += '其他错误';
                }

                errorMsg += ` (详情: ${errDetail})`;
                showError(errorMsg);
                statusText.textContent = '播放错误';
                streamStatus.textContent = '连接失败';
                audioState.textContent = '未知';
            });

            flvPlayer.on(flvjs.Events.LOADING_COMPLETE, () => {
                loadingIndicator.style.display = 'none';
            });

            flvPlayer.on(flvjs.Events.STATISTICS_INFO, () => {
                // 可以在这里更新统计信息
            });

            // 监听音量变化
            videoElement.addEventListener('volumechange', updateVolumeDisplay);

            // 初始音量设置
            videoElement.volume = 1;
            updateVolumeDisplay();
        }

        // 检查音频状态
        function checkAudioState() {
            setTimeout(() => {
                if (videoElement.mozHasAudio || videoElement.webkitAudioDecodedByteCount > 0) {
                    audioState.textContent = '正常';
                    audioState.style.color = '#38ef7d';
                } else {
                    audioState.textContent = '无音频流';
                    audioState.style.color = '#ff4b2b';
                }
            }, 2000);
        }

        // 更新音量显示
        function updateVolumeDisplay() {
            const volume = videoElement.volume;
            const percent = Math.round(volume * 100);

            // 更新滑块
            volumeSlider.value = volume;

            // 更新状态显示
            audioStatus.innerHTML = isMuted ?
                `<i class="fas fa-volume-mute"></i> <span>静音状态</span>` :
                `<i class="fas fa-volume-${volume > 0.5 ? 'up' : volume > 0 ? 'down' : 'off'}"></i> <span>音量: ${percent}%</span>`;
        }

        // 切换静音状态
        function toggleMute() {
            isMuted = !videoElement.muted;
            videoElement.muted = isMuted;

            // 更新按钮
            muteBtn.innerHTML = isMuted ?
                '<i class="fas fa-volume-mute"></i> 取消静音' :
                '<i class="fas fa-volume-up"></i> 静音';

            updateVolumeDisplay();
        }

        // 调整音量
        function setVolume() {
            videoElement.volume = volumeSlider.value;
            videoElement.muted = false;
            isMuted = false;

            // 更新静音按钮
            muteBtn.innerHTML = '<i class="fas fa-volume-up"></i> 静音';

            updateVolumeDisplay();
        }

        // 显示错误信息
        function showError(message) {
            errorDisplay.style.display = 'block';
            errorDisplay.innerHTML = `
                <i class="fas fa-exclamation-triangle"></i>
                <p>${message}</p>
                <button class="error-btn" onclick="initPlayer()">重试</button>
            `;
            loadingIndicator.style.display = 'none';
        }

        // 播放/暂停控制
        function togglePlay() {
            if (videoElement.paused) {
                flvPlayer.play().then(() => {
                    statusText.textContent = '正在播放';
                    playBtn.innerHTML = '<i class="fas fa-pause"></i> 暂停';
                }).catch(e => {
                    console.error('播放失败:', e);
                    statusText.textContent = '播放失败';
                });
            } else {
                flvPlayer.pause();
                statusText.textContent = '已暂停';
                playBtn.innerHTML = '<i class="fas fa-play"></i> 播放';
            }
        }

        // 停止播放
        function stopPlayback() {
            if (flvPlayer) {
                flvPlayer.pause();
                flvPlayer.unload();
                statusText.textContent = '已停止';
                streamStatus.textContent = '未连接';
                playBtn.innerHTML = '<i class="fas fa-play"></i> 播放';
            }
        }

        // 刷新播放器
        function refreshPlayer() {
            statusText.textContent = '正在刷新...';
            streamStatus.textContent = '重新连接中';
            loadingIndicator.style.display = 'block';
            errorDisplay.style.display = 'none';

            setTimeout(() => {
                initPlayer();
            }, 500);
        }

        // 全屏控制
        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                if (videoElement.requestFullscreen) {
                    videoElement.requestFullscreen();
                } else if (videoElement.mozRequestFullScreen) {
                    videoElement.mozRequestFullScreen();
                } else if (videoElement.webkitRequestFullscreen) {
                    videoElement.webkitRequestFullscreen();
                } else if (videoElement.msRequestFullscreen) {
                    videoElement.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.mozCancelFullScreen) {
                    document.mozCancelFullScreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        // 事件绑定
        playBtn.addEventListener('click', togglePlay);
        stopBtn.addEventListener('click', stopPlayback);
        refreshBtn.addEventListener('click', refreshPlayer);
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        muteBtn.addEventListener('click', toggleMute);
        volumeSlider.addEventListener('input', setVolume);

        // 视频播放状态变化
        videoElement.addEventListener('play', () => {
            statusText.textContent = '正在播放';
            playBtn.innerHTML = '<i class="fas fa-pause"></i> 暂停';
        });

        videoElement.addEventListener('pause', () => {
            statusText.textContent = '已暂停';
            playBtn.innerHTML = '<i class="fas fa-play"></i> 播放';
        });

        videoElement.addEventListener('waiting', () => {
            statusText.textContent = '缓冲中...';
            loadingIndicator.style.display = 'block';
        });

        videoElement.addEventListener('playing', () => {
            loadingIndicator.style.display = 'none';
        });

        // 页面加载完成后初始化播放器
        window.addEventListener('load', initPlayer);
        // toggleMute();
        
    </script>
</body>

</html>
