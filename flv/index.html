<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>flv.js 示例</title>
    <script src="https://cdn.jsdelivr.net/npm/flv.js@1.6.2/dist/flv.min.js"></script>
</head>

<body>
    <video id="videoElement" controls width="100%"></video>

    <script>
        // 检查浏览器支持
        if (flvjs.isSupported()) {
            const videoElement = document.getElementById('videoElement');

            // 创建 FLV 播放器
            const flvPlayer = flvjs.createPlayer({
                type: 'flv',          // 播放类型
                url: 'https://qqgroup.6721.liveplay.ilive.qq.com/live/6721_1d9bc6bbbcec174cafe7e0d96a90a21b_1080p4000k.flv?txSecret=dd6ba0a8f2bf7c436a18844abc460c3c&txTime=6856708B', // 替换为实际FLV地址
                isLive: false,        // 如果是直播流改为 true
                cors: true,           // 启用跨域
                hasAudio: true,     // 启用音频
                hasVideo: true,     // 启用视频
                stashInitialSize: 128, // 减少初始缓冲
                enableWorker: true,  // 使用Web Worker解码
                enableStashBuffer: false  // 直播时建议关闭缓冲区
            });

            // 关联 video 标签
            flvPlayer.attachMediaElement(videoElement);

            // 加载并播放
            flvPlayer.load();
            flvPlayer.play().catch(e => {
                console.error('播放失败:', e);
            });

            // 错误监听
            flvPlayer.on(flvjs.Events.ERROR, (errType, errDetail) => {
                console.error('播放器错误:', errType, errDetail);
            });
        } else {
            alert('当前浏览器不支持 flv.js！');
        }
    </script>
</body>

</html>
