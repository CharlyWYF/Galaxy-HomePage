<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>单双周查询工具</title>
    <!-- 自定义Material Design 3风格样式 -->
    <style>
        :root {
            --md-sys-color-primary: #3b82f6;
            --md-sys-color-primary-container: #dbeafe;
            --md-sys-color-on-primary: #ffffff;
            --md-sys-color-on-primary-container: #1e3a8a;
            --md-sys-color-surface: #ffffff;
            --md-sys-color-surface-variant: #f3f4f6;
            --md-sys-color-on-surface: #1f2937;
            --md-sys-color-on-surface-variant: #4b5563;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
            gap: 2rem;
        }

        .container {
            background-color: var(--md-sys-color-surface);
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 1.5rem;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        h1 {
            color: var(--md-sys-color-primary);
            font-size: 2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .month-navigator {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.5rem 0;
        }

        .month-navigator h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--md-sys-color-on-surface);
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--md-sys-color-primary);
            padding: 0.5rem;
            border-radius: 50%;
            transition: background-color 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
        }

        .nav-btn:hover {
            background-color: var(--md-sys-color-surface-variant);
        }

        /* 日历网格样式 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
        }

        .calendar-header {
            font-weight: 600;
            text-align: center;
            padding: 0.5rem 0;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 0.8125rem;
        }

        .calendar-day {
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
            font-size: 0.8125rem;
            margin: 0 auto;
        }

        .calendar-day:hover {
            background-color: var(--md-sys-color-surface-variant);
        }

        .calendar-day.current-month {
            color: var(--md-sys-color-on-surface);
        }

        .calendar-day.other-month {
            color: #9ca3af;
            opacity: 0.5;
        }

        .calendar-day.today {
            font-weight: 600;
            position: relative;
            z-index: 1;
            border: 2px solid #eab308;
        }

        .calendar-day.selected {
            border: 2px solid #7e22ce;
            background-color: rgba(168, 85, 247, 0.2);
        }

        .date-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--md-sys-color-primary-container);
            padding: 0.75rem;
            border-radius: 0.75rem;
            color: var(--md-sys-color-on-primary-container);
        }

        .date-info-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.25rem;
        }

        .date-info-label {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        .date-info-value {
            font-size: 1rem;
            font-weight: 600;
        }

        .button-container {
            display: flex;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background-color: var(--md-sys-color-primary);
            color: var(--md-sys-color-on-primary);
        }

        .btn-primary:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            padding: 1rem;
            background-color: var(--md-sys-color-surface-variant);
            border-radius: 0.75rem;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .legend-color {
            width: 1rem;
            height: 1rem;
            border-radius: 50%;
        }

        .workday-legend {
            background-color: rgba(168, 85, 247, 0.15);
            border: 1px solid #7e22ce;
        }

        .holiday-legend {
            background-color: rgba(16, 185, 129, 0.15);
            border: 1px solid #047857;
        }

        .today-legend {
            background-color: transparent;
            border: 2px solid #eab308;
        }

        .footer {
            text-align: center;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 0.875rem;
            padding-top: 1rem;
        }

        /* 响应式设计 */
        @media (max-width: 640px) {
            .container {
                padding: 1rem;
                max-width: 90%;
            }

            h1 {
                font-size: 1.5rem;
            }

            .legend {
                flex-direction: column;
                gap: 0.75rem;
                padding: 0.75rem;
            }

            .calendar-day {
                width: 40px;
                height: 40px;
                font-size: 0.75rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>单双周查询工具</h1>
        
        <!-- 月份导航 -->
        <div class="month-navigator">
            <button id="prev-month" class="nav-btn">←</button>
            <h2 id="current-month-display">2024年1月</h2>
            <button id="next-month" class="nav-btn">→</button>
        </div>

        <!-- 日历网格 -->
        <div class="calendar-grid" id="calendar-grid">
            <!-- 星期头部 -->
            <div class="calendar-header">日</div>
            <div class="calendar-header">一</div>
            <div class="calendar-header">二</div>
            <div class="calendar-header">三</div>
            <div class="calendar-header">四</div>
            <div class="calendar-header">五</div>
            <div class="calendar-header">六</div>
            <!-- 日期将通过JS动态生成 -->
        </div>

        <!-- 选中日期信息 -->
        <div class="date-info">
            <div class="date-info-item">
                <span class="date-info-label">选中日期</span>
                <span id="selected-date" class="date-info-value">2024年1月1日</span>
            </div>
            <div class="date-info-item">
                <span class="date-info-label">单双周状态</span>
                <span id="week-status" class="date-info-value">双周（双休）</span>
            </div>
        </div>

        <div class="button-container">
            <button id="today-btn" class="btn btn-primary">回到今天</button>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-color workday-legend"></div>
                <span>工作日</span>
            </div>
            <div class="legend-item">
                <div class="legend-color holiday-legend"></div>
                <span>放假</span>
            </div>
            <div class="legend-item">
                <div class="legend-color today-legend"></div>
                <span>今天</span>
            </div>
        </div>
    </div>

    <div class="footer">
        <p>基于周六日期奇偶性判断单双周 v1.0</p>
    </div>

    <script>
        // DOM 元素
        const calendarGrid = document.getElementById('calendar-grid');
        const currentMonthDisplay = document.getElementById('current-month-display');
        const prevMonthBtn = document.getElementById('prev-month');
        const nextMonthBtn = document.getElementById('next-month');
        const todayBtn = document.getElementById('today-btn');
        const selectedDateElem = document.getElementById('selected-date');
        const weekStatusElem = document.getElementById('week-status');

        // 当前日期
        let currentDate = new Date();
        let selectedDate = new Date();

        // 初始化日历
        function initCalendar() {
            // 渲染日历
            renderCalendar();
            
            // 事件监听
            prevMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar();
            });

            nextMonthBtn.addEventListener('click', () => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar();
            });

            todayBtn.addEventListener('click', () => {
                currentDate = new Date();
                selectedDate = new Date();
                renderCalendar();
                updateSelectedDateInfo(selectedDate);
            });
        }

        // 渲染日历
        function renderCalendar() {
            // 更新月份显示
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            currentMonthDisplay.textContent = `${year}年${month + 1}月`;

            // 清空日历
            // 保留星期头部（前7个元素）
            while (calendarGrid.children.length > 7) {
                calendarGrid.removeChild(calendarGrid.lastChild);
            }

            // 获取当月第一天
            const firstDay = new Date(year, month, 1);
            // 获取当月最后一天
            const lastDay = new Date(year, month + 1, 0);

            // 获取当月第一天是星期几
            const firstDayOfWeek = firstDay.getDay(); // 0是周日，1-6是周一到周六

            // 获取上个月的最后几天
            const prevMonthLastDay = new Date(year, month, 0).getDate();

            // 添加上个月的日期
            for (let i = firstDayOfWeek - 1; i >= 0; i--) {
                const day = prevMonthLastDay - i;
                const date = new Date(year, month - 1, day);
                createDayElement(date, 'other-month');
            }

            // 添加当月的日期
            for (let day = 1; day <= lastDay.getDate(); day++) {
                const date = new Date(year, month, day);
                const classes = ['current-month'];
                if (isSameDay(date, new Date())) {
                    classes.push('today');
                }
                if (isSameDay(date, selectedDate)) {
                    classes.push('selected');
                }
                createDayElement(date, classes);
            }

            // 计算需要添加的下个月的天数
            const daysAdded = firstDayOfWeek + lastDay.getDate();
            const nextMonthDays = 42 - daysAdded; // 6行7列=42个格子

            // 添加下个月的日期
            for (let day = 1; day <= nextMonthDays; day++) {
                const date = new Date(year, month + 1, day);
                createDayElement(date, 'other-month');
            }

            // 更新选中日期信息
            updateSelectedDateInfo(selectedDate);
        }

        // 创建日期元素
        function createDayElement(date, classes) {
            const dayElement = document.createElement('div');
            dayElement.classList.add('calendar-day');
            
            // 添加类
            if (Array.isArray(classes)) {
                classes.forEach(cls => dayElement.classList.add(cls));
            } else {
                dayElement.classList.add(classes);
            }

            // 设置日期文本
            dayElement.textContent = date.getDate();
            
            // 获取当周周六并判断单双周
            const saturday = getSaturdayOfWeek(date);
            const dayOfMonth = saturday.getDate();
            const isSingleWeek = dayOfMonth % 2 === 1;
            const dayOfWeek = date.getDay();
            
            // 如果是当前月，根据工作日/放假设置不同颜色
            if (dayElement.classList.contains('current-month')) {
                    let isWorkDay = ((dayOfWeek >= 1 && dayOfWeek <= 5) || (dayOfWeek === 6 && isSingleWeek));
                    
                    // 先根据工作日/放假设置背景色（适用于所有日期，包括今天）
                    if (isWorkDay) {
                        dayElement.style.backgroundColor = 'rgba(168, 85, 247, 0.15)';
                } else {
                        dayElement.style.backgroundColor = 'rgba(16, 185, 129, 0.15)';
                    }
                    
                    // 然后设置文字颜色
                    if (dayElement.classList.contains('today')) {
                        // 今天日期：黄色文字
                        dayElement.style.color = '#eab308';
                    } else {
                        // 其他日期：根据工作日/放假设置文字颜色
                        dayElement.style.color = isWorkDay ? '#7e22ce' : '#047857';
                    }
                    
                    // 移除之前可能添加的样式元素
                    if (dayElement.classList.contains('today')) {
                        const existingStyles = document.querySelectorAll('style');
                        existingStyles.forEach(style => {
                            if (style.textContent.includes('today-star-')) {
                                style.remove();
                            }
                        });
                    }
                } else {
                // 非当前月的日期，使用浅色背景
                if ((dayOfWeek >= 1 && dayOfWeek <= 5) || (dayOfWeek === 6 && isSingleWeek)) {
                    dayElement.style.backgroundColor = 'rgba(168, 85, 247, 0.05)';
                } else {
                    dayElement.style.backgroundColor = 'rgba(16, 185, 129, 0.05)';
                }
            }

            // 添加点击事件
            dayElement.addEventListener('click', () => {
                // 移除之前选中的日期
                const prevSelected = calendarGrid.querySelector('.calendar-day.selected');
                if (prevSelected) {
                    prevSelected.classList.remove('selected');
                }
                
                // 设置当前选中日期
                dayElement.classList.add('selected');
                selectedDate = date;
                updateSelectedDateInfo(selectedDate);
                
                // 确保今天日期在被选中时保持黄色边框
                if (dayElement.classList.contains('today')) {
                    dayElement.style.borderColor = '#eab308';
                }
            });

            calendarGrid.appendChild(dayElement);
        }

        // 更新选中日期信息
        function updateSelectedDateInfo(date) {
            // 格式化选中日期
            selectedDateElem.textContent = formatDate(date);
            
            // 获取当周周六
            const saturday = getSaturdayOfWeek(date);
            const dayOfMonth = saturday.getDate();
            
            // 判断单双周
            const isSingleWeek = dayOfMonth % 2 === 1;
            const weekType = isSingleWeek ? '单周' : '双周';
            
            // 判断工作类型
            let workType;
            const selectedDayOfWeek = date.getDay();
            if (selectedDayOfWeek === 0) {
                workType = '放假';
            } else if (selectedDayOfWeek === 6) {
                workType = isSingleWeek ? '工作日' : '放假';
            } else {
                workType = '工作日';
            }
            
            // 更新状态文本和颜色
            weekStatusElem.textContent = `${weekType}（${workType}）`;
            weekStatusElem.style.color = workType === '放假' ? '#047857' : '#7e22ce';
            
            // 为选中日期添加边框颜色，但保留今天日期的黄色边框
            const dayElement = calendarGrid.querySelector('.calendar-day.selected');
            if (dayElement) {
                // 如果是今天日期，始终保持黄色边框
                if (dayElement.classList.contains('today')) {
                    dayElement.style.borderColor = '#eab308';
                } else {
                    dayElement.style.borderColor = workType === '放假' ? '#047857' : '#7e22ce';
                }
            }
        }

        // 判断两个日期是否是同一天
        function isSameDay(date1, date2) {
            return date1.getFullYear() === date2.getFullYear() &&
                   date1.getMonth() === date2.getMonth() &&
                   date1.getDate() === date2.getDate();
        }

        // 获取给定日期所在周的周六
        function getSaturdayOfWeek(date) {
            const temp = new Date(date);
            const dayOfWeek = temp.getDay(); // 0是周日，1-6是周一到周六
            
            // 计算到周六的天数差
            const diff = dayOfWeek === 0 ? -1 : 6 - dayOfWeek;
            temp.setDate(temp.getDate() + diff);
            
            return temp;
        }

        // 格式化日期为中文格式
        function formatDate(date) {
            const year = date.getFullYear();
            const month = date.getMonth() + 1;
            const day = date.getDate();
            return `${year}年${month.toString().padStart(2, '0')}月${day.toString().padStart(2, '0')}日`;
        }
        
        // 为选中日期添加点击事件处理
        function updateSelectedDayBorder() {
            const selectedDay = calendarGrid.querySelector('.calendar-day.selected');
            if (selectedDay) {
                // 如果是今天日期，始终保持黄色边框
                if (selectedDay.classList.contains('today')) {
                    selectedDay.style.borderColor = '#eab308';
                } else {
                    // 获取选中日期的工作类型
                    const date = selectedDate;
                    const saturday = getSaturdayOfWeek(date);
                    const isSingleWeek = saturday.getDate() % 2 === 1;
                    const selectedDayOfWeek = date.getDay();
                    
                    let workType;
                    if (selectedDayOfWeek === 0) {
                        workType = '放假';
                    } else if (selectedDayOfWeek === 6) {
                        workType = isSingleWeek ? '工作日' : '放假';
                    } else {
                        workType = '工作日';
                    }
                    
                    // 根据工作类型设置边框颜色
                    selectedDay.style.borderColor = workType === '放假' ? '#047857' : '#7e22ce';
                }
            }
        }

        // 初始化
        initCalendar();
    </script>
</body>
</html>
